[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-act-copilot"
version = "0.2.0"
description = "Evidence-grounded engineering review assistant with local Ollama or opt-in Gemini"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4,<5"]

[project.scripts]
aiact = "aiact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiact = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
