[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-act-copilot"
version = "0.4.3"
description = "Evidence-grounded engineering review assistant with local Ollama or opt-in Gemini"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
workbench = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
workbench-test = ["httpx>=0.27,<1"]
bot = [
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=48,<49; platform_system == 'Darwin' and platform_machine == 'x86_64'",
]
dev = ["pytest>=8,<10", "jsonschema>=4,<5"]

[project.scripts]
aiact = "aiact.cli:main"
aiact-bot = "aiact.github_bot.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiact = ["data/*.json", "data/*.gz", "data/official/*.json", "data/official/*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
