name: AI Act PR review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: aiact-review-${{ github.repository }}-${{ github.event.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      vars.AIACT_PR_REVIEW_ENABLED == 'true' &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request && github.event.comment.body == '/aiact rescan' &&
        github.event.comment.user.type != 'Bot'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Trusted default branch only. PR blobs are fetched as data, never executed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Prepare trusted engine
        run: uv sync --project engine --python 3.12 --locked --no-dev
      - name: Review changed Python files
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: engine/.venv/bin/python -m aiact.github_bot.actions
